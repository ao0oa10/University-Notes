<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ملخصات</title>
  <style>
    :root {
      --primary: #263b86;
      --primary-soft: #e8edfa;
      --bg: #f3f5fb;
      --text: #1c2840;
      --success: #0d7a3d;
      --danger: #b3202d;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      overflow-x: hidden;
    }

    header {
      background: var(--primary);
      color: var(--white);
      padding: 22px 16px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }

    header p {
      margin: 10px 0 0;
      font-size: 1rem;
      opacity: 0.95;
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 18px 12px 28px;
    }

    .card {
      background: var(--white);
      margin: 0 auto;
      padding: 20px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0001;
      width: min(100%, 680px);
      text-align: right;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .subjects {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .subject-btn,
    .choice-btn,
    .option-btn,
    .action-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 1rem;
      cursor: pointer;
      min-height: 48px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .subject-btn,
    .choice-btn,
    .option-btn {
      background: var(--primary-soft);
      color: var(--text);
      text-align: right;
    }

    .subject-btn:active,
    .choice-btn:active,
    .option-btn:active,
    .action-btn:active {
      transform: scale(0.99);
    }

    .action-btn {
      background: var(--primary);
      color: var(--white);
      text-align: center;
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .subject-title {
      margin: 0;
      color: var(--primary);
      font-size: 1.2rem;
    }

    .helper {
      margin: 8px 0 2px;
      color: #3f4f7d;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .tag {
      display: inline-block;
      background: #dce4fb;
      color: var(--primary);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
      margin-inline-start: 8px;
    }

    .progress-wrap {
      margin: 14px 0;
      background: #dde4f8;
      border-radius: 999px;
      overflow: hidden;
      height: 10px;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0;
      transition: width 0.2s ease;
    }

    .slide-box {
      background: #f7f9ff;
      border: 1px solid #d4dcf5;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      line-height: 1.8;
    }

    .slide-box h3 {
      margin-top: 0;
      margin-bottom: 8px;
      color: var(--primary);
      font-size: 1.08rem;
    }

    details {
      border: 1px solid #d8e0f8;
      border-radius: 12px;
      background: #fff;
      padding: 10px 12px;
    }

    details + details {
      margin-top: 8px;
    }

    summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--primary);
    }

    .quiz {
      margin-top: 14px;
      border-top: 1px dashed #cfd8f3;
      padding-top: 14px;
    }

    .quiz h4 {
      margin: 0 0 10px;
    }

    .options {
      display: grid;
      gap: 8px;
    }

    .option-btn {
      border: 2px solid transparent;
      font-size: 0.97rem;
    }

    .option-btn[disabled] {
      cursor: default;
      opacity: 1;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: #e6f7ee;
      color: #0f5a33;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: #fdeef0;
      color: #74111b;
    }

    .feedback {
      margin-top: 10px;
      min-height: 26px;
      font-weight: 700;
    }

    .feedback.success {
      color: var(--success);
    }

    .feedback.error {
      color: var(--danger);
    }

    .inline-actions {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
      margin-top: 10px;
    }

    .muted-btn {
      background: #e2e8fb;
      color: var(--text);
    }

    [hidden] {
      display: none !important;
    }

    button:focus-visible,
    summary:focus-visible {
      outline: 3px solid #4e68c1;
      outline-offset: 2px;
    }

    @media (min-width: 720px) {
      .actions-row,
      .inline-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .subjects {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>ملخصات 🎓</h1>
    <p>منصة عربية لمراجعة المواد الجامعية بأسلوب تفاعلي</p>
  </header>

  <main>
    <section id="home-view" class="card">
      <h2>اختر المادة</h2>
      <p class="helper">ابدأ من المادة ثم حدّد نوع الاختبار (Midterm / Final) للوصول إلى الشرائح والأسئلة.</p>
      <div id="subjects-list" class="subjects" aria-live="polite"></div>
    </section>

    <section id="exam-view" class="card" hidden>
      <h2 id="exam-subject-title" class="subject-title"></h2>
      <p class="helper">اختر نوع المراجعة:</p>
      <div class="stack">
        <button class="choice-btn" data-exam="midterm" type="button">Midterm - مراجعة نصف الفصل</button>
        <button class="choice-btn" data-exam="final" type="button">Final - مراجعة نهائية</button>
      </div>
      <div class="actions-row">
        <button class="action-btn muted-btn" id="exam-back-home" type="button">العودة للرئيسية</button>
      </div>
    </section>

    <section id="study-view" class="card" hidden>
      <div class="actions-row" style="margin-top: 0; margin-bottom: 10px;">
        <button class="action-btn muted-btn" id="back-to-exams" type="button">العودة لخيارات الاختبار</button>
        <button class="action-btn muted-btn" id="study-home" type="button">العودة للرئيسية</button>
      </div>

      <p id="current-track" class="helper" style="margin-top: 0;"></p>
      <div class="progress-wrap" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="progress-text" class="helper"></p>

      <article class="slide-box">
        <h3 id="slide-title"></h3>
        <p id="slide-content"></p>
        <div id="concepts" class="stack"></div>

        <section class="quiz" aria-live="polite">
          <h4 id="question-text"></h4>
          <div id="options" class="options"></div>
          <p id="feedback" class="feedback"></p>
          <div class="inline-actions">
            <button id="retry-btn" class="action-btn muted-btn" type="button" hidden>إعادة المحاولة</button>
            <button id="next-question-btn" class="action-btn" type="button" hidden>السؤال التالي</button>
          </div>
        </section>
      </article>

      <div class="actions-row">
        <button id="prev-btn" class="action-btn muted-btn" type="button">السابق</button>
        <button id="next-btn" class="action-btn" type="button">التالي</button>
      </div>
    </section>
  </main>

  <script>
    const courseData = [
      {
        id: 'law-intro',
        title: 'مقدمة في القانون',
        description: 'تعريف القانون، مصادره، والفروق بين القواعد القانونية والاجتماعية.',
        exams: {
          midterm: [
            {
              title: 'مفهوم القانون ووظيفته',
              text: 'القانون مجموعة قواعد عامة ومجردة تنظم سلوك الأفراد داخل المجتمع، وتكفل الدولة احترامها.',
              concepts: [
                { q: 'لماذا نحتاج إلى القانون؟', a: 'لحفظ النظام العام ومنع النزاعات وتحديد الحقوق والواجبات.' },
                { q: 'ما معنى قاعدة عامة ومجردة؟', a: 'تنطبق على جميع من تنطبق عليهم شروطها دون تمييز شخصي.' }
              ],
              question: {
                prompt: 'ما الوظيفة الأساسية للقانون؟',
                options: ['تنظيم التجارة فقط', 'تنظيم العلاقات في المجتمع', 'تحديد أسعار المنتجات فقط'],
                correctIndex: 1,
                successText: 'إجابة صحيحة: القانون ينظم العلاقات ويضمن الحقوق.'
              }
            },
            {
              title: 'مصادر القاعدة القانونية',
              text: 'من أهم مصادر القانون: التشريع، العرف، ومبادئ الشريعة أو الفقه بحسب النظام القانوني.',
              concepts: [
                { q: 'ما المقصود بالتشريع؟', a: 'قواعد مكتوبة تصدرها السلطة المختصة في الدولة.' },
                { q: 'متى يُعتد بالعرف؟', a: 'عند استقرار سلوك الناس على عادة معينة مع الإلزام بها قانونياً.' }
              ],
              question: {
                prompt: 'أيّ مما يلي يُعد مصدرًا رسميًا للقانون؟',
                options: ['الآراء الشخصية', 'التشريع', 'المذكرات الدراسية غير المعتمدة'],
                correctIndex: 1,
                successText: 'صحيح: التشريع مصدر رسمي أساسي للقواعد القانونية.'
              }
            }
          ],
          final: [
            {
              title: 'تقسيمات القانون',
              text: 'ينقسم القانون غالبًا إلى قانون عام وقانون خاص بحسب طبيعة العلاقة والأطراف المعنية.',
              concepts: [
                { q: 'ما القانون العام؟', a: 'ينظم علاقات الدولة بالسلطات العامة والأفراد بصفتها صاحبة سيادة.' },
                { q: 'ما القانون الخاص؟', a: 'ينظم علاقات الأفراد فيما بينهم على قدم المساواة.' }
              ],
              question: {
                prompt: 'القانون الذي ينظم علاقة الفرد بالدولة بصفتها سلطة عامة هو:',
                options: ['القانون الخاص', 'القانون العام', 'لا يوجد فرق بينهما'],
                correctIndex: 1,
                successText: 'ممتاز: هذه من خصائص القانون العام.'
              }
            },
            {
              title: 'تدرج القواعد القانونية',
              text: 'تُرتّب القواعد القانونية هرميًا من الدستور ثم القوانين ثم اللوائح، ويجب ألا يخالف الأدنى الأعلى.',
              concepts: [
                { q: 'لماذا يهم التدرج؟', a: 'لضمان اتساق النظام القانوني ومنع تعارض القواعد.' },
                { q: 'ماذا يحدث عند التعارض؟', a: 'تُقدّم القاعدة الأعلى مرتبة ويتم إهمال المخالِفة.' }
              ],
              question: {
                prompt: 'عند تعارض لائحة مع قانون، أيهما يُطبّق؟',
                options: ['اللائحة لأنها أحدث', 'القانون لأنه أعلى مرتبة', 'يُترك للقاضي دون قاعدة'],
                correctIndex: 1,
                successText: 'إجابة صحيحة: القاعدة الأعلى مرتبة هي الواجبة التطبيق.'
              }
            }
          ]
        }
      },
      {
        id: 'intro-management',
        title: 'مبادئ الإدارة',
        description: 'ملخص سريع لمفاهيم التخطيط والتنظيم والقيادة والرقابة.'
      },
      {
        id: 'economic-basics',
        title: 'أساسيات الاقتصاد',
        description: 'عرض تمهيدي لمبادئ العرض والطلب والتوازن في السوق.'
      }
    ];

    const state = {
      subjectId: null,
      examType: null,
      slideIndex: 0,
      answered: false
    };

    const homeView = document.getElementById('home-view');
    const examView = document.getElementById('exam-view');
    const studyView = document.getElementById('study-view');

    const subjectsList = document.getElementById('subjects-list');
    const examSubjectTitle = document.getElementById('exam-subject-title');
    const currentTrack = document.getElementById('current-track');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const slideTitle = document.getElementById('slide-title');
    const slideContent = document.getElementById('slide-content');
    const conceptsContainer = document.getElementById('concepts');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options');
    const feedback = document.getElementById('feedback');

    const retryBtn = document.getElementById('retry-btn');
    const nextQuestionBtn = document.getElementById('next-question-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function getSelectedSubject() {
      return courseData.find(subject => subject.id === state.subjectId) || null;
    }

    function getSlides() {
      const subject = getSelectedSubject();
      if (!subject || !subject.exams || !subject.exams[state.examType]) return [];
      return subject.exams[state.examType];
    }

    function showView(viewName) {
      homeView.hidden = viewName !== 'home';
      examView.hidden = viewName !== 'exam';
      studyView.hidden = viewName !== 'study';
    }

    function resetQuestionUi() {
      state.answered = false;
      feedback.textContent = '';
      feedback.className = 'feedback';
      retryBtn.hidden = true;
      nextQuestionBtn.hidden = true;
    }

    function renderSubjects() {
      subjectsList.innerHTML = '';

      courseData.forEach((subject) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'subject-btn';

        if (subject.exams) {
          button.innerHTML = `<strong>${subject.title}</strong><span class="tag">متاح الآن</span><div class="helper">${subject.description}</div>`;
          button.addEventListener('click', () => {
            state.subjectId = subject.id;
            state.examType = null;
            state.slideIndex = 0;
            examSubjectTitle.textContent = subject.title;
            showView('exam');
          });
        } else {
          button.disabled = true;
          button.style.opacity = '0.75';
          button.innerHTML = `<strong>${subject.title}</strong><span class="tag">قريبًا</span><div class="helper">${subject.description}</div>`;
        }

        subjectsList.appendChild(button);
      });
    }

    function renderSlide() {
      const subject = getSelectedSubject();
      const slides = getSlides();
      const slide = slides[state.slideIndex];

      if (!subject || !slide) {
        goHome();
        return;
      }

      currentTrack.textContent = `${subject.title} • ${state.examType === 'midterm' ? 'Midterm' : 'Final'}`;
      slideTitle.textContent = slide.title;
      slideContent.textContent = slide.text;
      progressText.textContent = `الشريحة ${state.slideIndex + 1} من ${slides.length}`;
      progressBar.style.width = `${((state.slideIndex + 1) / slides.length) * 100}%`;
      prevBtn.disabled = state.slideIndex === 0;
      nextBtn.disabled = state.slideIndex === slides.length - 1;

      conceptsContainer.innerHTML = '';
      slide.concepts.forEach((concept) => {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const answer = document.createElement('p');
        summary.textContent = concept.q;
        answer.textContent = concept.a;
        details.appendChild(summary);
        details.appendChild(answer);
        conceptsContainer.appendChild(details);
      });

      questionText.textContent = slide.question.prompt;
      optionsContainer.innerHTML = '';
      slide.question.options.forEach((option, index) => {
        const optionBtn = document.createElement('button');
        optionBtn.type = 'button';
        optionBtn.className = 'option-btn';
        optionBtn.textContent = option;
        optionBtn.addEventListener('click', () => handleAnswer(index));
        optionsContainer.appendChild(optionBtn);
      });

      resetQuestionUi();
      const firstOption = optionsContainer.querySelector('button');
      if (firstOption) firstOption.focus();
    }

    function handleAnswer(selectedIndex) {
      if (state.answered) return;

      state.answered = true;
      const slide = getSlides()[state.slideIndex];
      const buttons = Array.from(optionsContainer.querySelectorAll('button'));
      const isCorrect = selectedIndex === slide.question.correctIndex;

      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === slide.question.correctIndex) {
          btn.classList.add('correct');
        }
        if (!isCorrect && index === selectedIndex) {
          btn.classList.add('wrong');
        }
      });

      if (isCorrect) {
        feedback.textContent = `✅ ${slide.question.successText}`;
        feedback.classList.add('success');
        if (state.slideIndex < getSlides().length - 1) {
          nextQuestionBtn.hidden = false;
          nextQuestionBtn.focus();
        }
      } else {
        feedback.textContent = '❌ إجابة غير صحيحة. راجع المفهوم ثم أعد المحاولة.';
        feedback.classList.add('error');
        retryBtn.hidden = false;
        retryBtn.focus();
      }
    }

    function retryQuestion() {
      const buttons = Array.from(optionsContainer.querySelectorAll('button'));
      buttons.forEach((btn) => {
        btn.disabled = false;
        btn.classList.remove('correct', 'wrong');
      });
      resetQuestionUi();
      if (buttons[0]) buttons[0].focus();
    }

    function nextSlide() {
      const slides = getSlides();
      if (state.slideIndex < slides.length - 1) {
        state.slideIndex += 1;
        renderSlide();
      }
    }

    function prevSlide() {
      if (state.slideIndex > 0) {
        state.slideIndex -= 1;
        renderSlide();
      }
    }

    function openExam(examType) {
      state.examType = examType;
      state.slideIndex = 0;
      showView('study');
      renderSlide();
    }

    function goHome() {
      state.subjectId = null;
      state.examType = null;
      state.slideIndex = 0;
      resetQuestionUi();
      showView('home');
    }

    document.querySelectorAll('.choice-btn').forEach((button) => {
      button.addEventListener('click', () => openExam(button.dataset.exam));
    });

    document.getElementById('exam-back-home').addEventListener('click', goHome);
    document.getElementById('back-to-exams').addEventListener('click', () => showView('exam'));
    document.getElementById('study-home').addEventListener('click', goHome);
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    retryBtn.addEventListener('click', retryQuestion);
    nextQuestionBtn.addEventListener('click', nextSlide);

    renderSubjects();
    showView('home');
  </script>
</body>
</html>
