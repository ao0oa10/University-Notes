<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ملخصات</title>
  <link rel="stylesheet" href="css/arabic.css">
  <style>
    :root {
      --primary: #263b86;
      --primary-soft: #e8edfa;
      --bg: #f3f5fb;
      --text: #1c2840;
      --success: #0d7a3d;
      --danger: #b3202d;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      overflow-x: hidden;
    }

    header {
      background: var(--primary);
      color: var(--white);
      padding: 22px 16px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }

    header p {
      margin: 10px 0 0;
      font-size: 1rem;
      opacity: 0.95;
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 18px 12px 28px;
    }

    .card {
      background: var(--white);
      margin: 0 auto;
      padding: 20px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0001;
      width: min(100%, 680px);
      text-align: right;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .subjects {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .subject-btn,
    .choice-btn,
    .option-btn,
    .action-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 1rem;
      cursor: pointer;
      min-height: 48px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .subject-btn,
    .choice-btn,
    .option-btn {
      background: var(--primary-soft);
      color: var(--text);
      text-align: right;
    }

    .subject-btn:active,
    .choice-btn:active,
    .option-btn:active,
    .action-btn:active {
      transform: scale(0.99);
    }

    .action-btn {
      background: var(--primary);
      color: var(--white);
      text-align: center;
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .subject-title {
      margin: 0;
      color: var(--primary);
      font-size: 1.2rem;
    }

    .helper {
      margin: 8px 0 2px;
      color: #3f4f7d;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .tag {
      display: inline-block;
      background: #dce4fb;
      color: var(--primary);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
      margin-inline-start: 8px;
    }

    .progress-wrap {
      margin: 14px 0;
      background: #dde4f8;
      border-radius: 999px;
      overflow: hidden;
      height: 10px;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0;
      transition: width 0.2s ease;
    }

    .slide-box {
      background: #f7f9ff;
      border: 1px solid #d4dcf5;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      line-height: 1.8;
    }

    .slide-box h3 {
      margin-top: 0;
      margin-bottom: 8px;
      color: var(--primary);
      font-size: 1.08rem;
    }

    details {
      border: 1px solid #d8e0f8;
      border-radius: 12px;
      background: #fff;
      padding: 10px 12px;
    }

    details + details {
      margin-top: 8px;
    }

    summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--primary);
    }

    .quiz {
      margin-top: 14px;
      border-top: 1px dashed #cfd8f3;
      padding-top: 14px;
    }

    .quiz h4 {
      margin: 0 0 10px;
    }

    .options {
      display: grid;
      gap: 8px;
    }

    .option-btn {
      border: 2px solid transparent;
      font-size: 0.97rem;
    }

    .option-btn[disabled] {
      cursor: default;
      opacity: 1;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: #e6f7ee;
      color: #0f5a33;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: #fdeef0;
      color: #74111b;
    }

    .feedback {
      margin-top: 10px;
      min-height: 26px;
      font-weight: 700;
    }

    .feedback.success {
      color: var(--success);
    }

    .feedback.error {
      color: var(--danger);
    }

    .inline-actions {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
      margin-top: 10px;
    }

    .muted-btn {
      background: #e2e8fb;
      color: var(--text);
    }

    [hidden] {
      display: none !important;
    }

    button:focus-visible,
    summary:focus-visible {
      outline: 3px solid #4e68c1;
      outline-offset: 2px;
    }

    @media (min-width: 720px) {
      .actions-row,
      .inline-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .subjects {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>ملخصات 🎓</h1>
    <p>منصة عربية لمراجعة المواد الجامعية بأسلوب تفاعلي</p>
  </header>

  <main>
    <section id="home-view" class="card">
      <h2>اختر المادة</h2>
      <p class="helper">ابدأ من المادة ثم حدّد نوع الاختبار (Midterm / Final) للوصول إلى الشرائح والأسئلة.</p>
      <div id="subjects-list" class="subjects" aria-live="polite"></div>
    </section>

    <section id="exam-view" class="card" hidden>
      <h2 id="exam-subject-title" class="subject-title"></h2>
      <p class="helper">اختر نوع المراجعة:</p>
      <p id="exam-note" class="helper" hidden></p>
      <div class="stack">
        <button class="choice-btn" id="exam-midterm-btn" data-exam="midterm" type="button">Midterm - مراجعة نصف الفصل</button>
        <button class="choice-btn" id="exam-final-btn" data-exam="final" type="button">Final - مراجعة نهائية</button>
      </div>
      <div class="actions-row">
        <button class="action-btn muted-btn" id="exam-back-home" type="button">العودة للرئيسية</button>
      </div>
    </section>

    <section id="study-view" class="card" hidden>
      <div class="actions-row" style="margin-top: 0; margin-bottom: 10px;">
        <button class="action-btn muted-btn" id="back-to-exams" type="button">العودة لخيارات الاختبار</button>
        <button class="action-btn muted-btn" id="study-home" type="button">العودة للرئيسية</button>
      </div>

      <p id="current-track" class="helper" style="margin-top: 0;"></p>
      <div class="progress-wrap" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="progress-text" class="helper"></p>

      <article class="slide-box">
        <h3 id="slide-title"></h3>
        <p id="slide-content"></p>
        <div id="concepts" class="stack"></div>

        <section class="quiz" aria-live="polite">
          <h4 id="question-text"></h4>
          <div id="options" class="options"></div>
          <p id="feedback" class="feedback"></p>
          <div class="inline-actions">
            <button id="retry-btn" class="action-btn muted-btn" type="button" hidden>إعادة المحاولة</button>
            <button id="next-question-btn" class="action-btn" type="button" hidden>السؤال التالي</button>
          </div>
        </section>
      </article>

      <div class="actions-row">
        <button id="prev-btn" class="action-btn muted-btn" type="button">السابق</button>
        <button id="next-btn" class="action-btn" type="button">التالي</button>
      </div>
    </section>

    <section id="arabic-view" class="card" hidden>
      <div class="actions-row" style="margin-top: 0; margin-bottom: 10px;">
        <button class="action-btn muted-btn" id="arabic-back-to-exams" type="button">العودة لخيارات الاختبار</button>
        <button class="action-btn muted-btn" id="arabic-home" type="button">العودة للرئيسية</button>
      </div>
      <h2 class="subject-title">اللغة العربية <span class="tag">Midterm</span></h2>
      <p id="arabic-summary" class="helper"></p>
      <div id="arabic-nav" class="subjects" role="tablist" aria-label="أقسام العربي">
        <button type="button" class="subject-btn arabic-nav-btn" data-panel="mindmap">خريطة المنهج</button>
        <button type="button" class="subject-btn arabic-nav-btn" data-panel="lessons">الدروس</button>
        <button type="button" class="subject-btn arabic-nav-btn" data-panel="flashcards">بطاقات الاسترجاع</button>
        <button type="button" class="subject-btn arabic-nav-btn" data-panel="question-bank">بنك الأسئلة</button>
        <button type="button" class="subject-btn arabic-nav-btn" data-panel="mock-exam">الاختبار التجريبي</button>
        <button type="button" class="subject-btn arabic-nav-btn" data-panel="mistakes">أخطائي / الأسئلة التي تحتاج مراجعة</button>
      </div>
      <div id="arabic-panel" class="arabic-panel" aria-live="polite"></div>
      <div class="actions-row">
        <button class="action-btn muted-btn" id="arabic-reset-progress" type="button">مسح التقدم</button>
      </div>
    </section>
  </main>

  <script src="js/arabic.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
